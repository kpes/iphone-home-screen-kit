name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests (no phone, no pymobiledevice3)
        run: python -B -m unittest discover -s tests -v

  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Agent Skills spec check
        run: |
          pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
          skills-ref validate .claude/skills/iphone-home-screen
